gaps:
- No enumeration of non-zero businessCode values is published — the largest error-semantics gap on this API.
- No RFC 9457 problem+json, no error type URIs, no remediation guidance.
- No documented HTTP status contract; failures are not distinguishable by status code.
- No error catalogue for the OAuth token endpoint beyond standard IdentityServer behaviour.
