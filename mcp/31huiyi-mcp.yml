caveats:
- 'Input schemas are NOT included: 31 publishes no OpenAPI, so parameter shapes exist only as HTML tables
  in the developer center. A real server would have to be built from those pages by hand.'
- Almost every operation is POST regardless of read/write intent, so a read-only tool subset cannot be
  inferred from the HTTP method — it must be read from the operation name.
- Attendee-facing tools handle personal data (name, mobile, email, ID number, face recognition, three-factor
  identity verification). Any real MCP exposure of this surface needs consent handling.
