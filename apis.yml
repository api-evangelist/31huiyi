apis:
- aid: 31huiyi-openapi
  name: 31 OpenAPI
  description: The 31huiyi (31会议) OpenAPI — an OAuth 2.0 bearer-protected REST surface documented in the
    public developer center at api-help.31huiyi.com. It exposes attendee registration and lifecycle,
    check-in, schedules and venues, speakers, exhibitors and badges, tickets and orders, reception and
    hotels, form center, file upload, identity verification, SSO account creation and CMS content. All
    business operations are POST (a small number are GET) against https://31api.31huiyi.com under the
    /op/ prefix; a /op/notoken/ prefix marks the operations that do not require a user token.
