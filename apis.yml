aid: 31huiyi
name: 31huiyi
description: '31huiyi (31会议 / 31Event) is the digital event and exhibition SaaS platform operated by
  Shanghai Bayantu Information Technology Co., Ltd. (上海八彦图信息科技有限公司), founded 2010 and headquartered
  in Shanghai, China. It runs a product family covering conference management (31大会易), lightweight event
  management (31轻会), exhibition management (31展览云), on-site smart check-in and reception (31智慧现场),
  virtual events and an event AI assistant. It publishes a public developer center at api-help.31huiyi.com
  documenting an OAuth 2.0 / OpenID Connect protected REST OpenAPI at 31api.31huiyi.com, covering attendee
  registration, check-in, schedules, speakers, exhibitors, tickets, reception and CMS, plus a set of outbound
  push (webhook) callbacks a customer implements to receive check-in, attendee and exhibitor data.'
