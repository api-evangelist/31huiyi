name: 31huiyi data model
description: >-
  Entity graph derived from the identifier fields and payload tables published across the 31 developer
  center. There is no OpenAPI and no components.schemas to read, so relationships here are derived from
  the id fields that recur across documented request and response bodies (bventId, attendeeId,
  attendeeTypeId, orderId, itemSkuId, exhibitorOrgId, scheduleId, accountId) rather than from $ref links.
  Confidence is stated per relationship.
identifier_format: >-
  GUID/UUID strings throughout (e.g. 07320000-fe25-16f7-4c65-08d9fb59aefd). No type-prefixed ids, so an
  identifier alone does not reveal what it points at. Newer records use UUIDv7-shaped values.
entities:
- name: Bvent
  label: 会议 / 活动 — event, conference or exhibition
  description: >-
    The root aggregate. Almost every operation on the API takes a bventId. Carries title, subtitle,
    start/end time, venue, address, country/province/city/district, language, cover, industry type,
    hold type, tags[] and a RelationType of Standard | Master | Children (which is how sub-forums and
    concurrent events hang off a parent event).
  key: bventId
  operations: [GetBvents, QueryBvents, GetBventDetail, CreatedSubForum, UpdatedSubForum]
  docs: https://api-help.31huiyi.com/zh/getBventDetails
- name: AttendeeType
  label: 人群类别 — attendee category / crowd type
  description: >-
    Per-event attendee category that defines which registration form fields apply. Registration cannot
    be composed without one.
  key: attendeeTypeId
  docs: https://api-help.31huiyi.com/zh/new-getTypeList
- name: Attendee
  label: 参会人 — attendee
  description: >-
    A person registered to an event. Has no fixed schema — carries attendeeFieldValues[] of
    organiser-defined fields. Status is one of Unregistered, WaitedList, NeedComplementInfo, Cancelled,
    Registered, PendingApproval, Unpaid, Denied, NeedEditInfo, LogOut.
  key: attendeeId
  docs: https://api-help.31huiyi.com/zh/GetAttendeeDetail
- name: Account
  label: 账户 — platform user account
  description: >-
    The SSO identity. Created or resolved with createForClient; accountName, email or mobile serve as
    login credentials and must be unique.
  key: accountId
  docs: https://api-help.31huiyi.com/zh/oauth
- name: Order
  label: 订单 — order
  description: Created by ticketed registration. Carries orderNo, orderStatus (Paid | UnPaid), orderAmount and a payment link.
  key: orderId
  docs: https://api-help.31huiyi.com/zh/queryorderinfo
- name: ItemSku
  label: 门票 / 商品 — ticket or merchandise SKU
  description: Sellable item with stock; GetItemStock reads availability.
  key: itemSkuId
  docs: https://api-help.31huiyi.com/zh/getItemStock
- name: Schedule
  label: 日程 — session / agenda item
  key: scheduleId
  docs: https://api-help.31huiyi.com/zh/queryScheduleDetail
- name: ScheduleCategory
  label: 日程分类 — session category
  docs: https://api-help.31huiyi.com/zh/CreateScheduleCategory
- name: ScheduleVenue
  label: 会场 — session venue/room
  docs: https://api-help.31huiyi.com/zh/CreateScheduleVenue
- name: Speaker
  label: 演讲嘉宾 — speaker
  docs: https://api-help.31huiyi.com/zh/speakerDetail
- name: SpeakerGroup
  label: 演讲嘉宾分组 — speaker group
  docs: https://api-help.31huiyi.com/zh/speakerGroupList
- name: Exhibitor
  label: 参展商 — exhibitor
  description: >-
    Exhibiting organisation. Carries an ExhibitorOrgId and OrgAccounts[] member accounts; status adds
    Disabled (封禁) to the attendee status set.
  key: exhibitorId / exhibitorOrgId
  docs: https://api-help.31huiyi.com/zh/SaveExhibitor
- name: Exhibit
  label: 展品 — exhibited product
  description: Status is numeric — 0 unknown, 1 pending review, 2 listed, 3 delisted, 4 disabled, 5 needs edit.
  docs: https://api-help.31huiyi.com/zh/exhibitInfoPush
- name: AttendeeCard
  label: 证件 — badge / credential
  description: >-
    Printed credential. CertificateStatus is 1 unmatched, 2 matched, 3 printed, 4 collected;
    AttendeeRole is 1 attendee, 32 staff, 256 exhibitor badge.
  docs: https://api-help.31huiyi.com/zh/CreateAttendeeCard
- name: CheckinRecord
  label: 签到记录 — check-in record
  description: >-
    Produced at a CheckinPoint. Carries checkinCode, checkinTime, direction, input type, device, and an
    optional temperature reading.
  key: checkinRecordId
  docs: https://api-help.31huiyi.com/zh/checkinpush
- name: CheckinPoint
  label: 签到点 — check-in point
  key: checkinPointId
