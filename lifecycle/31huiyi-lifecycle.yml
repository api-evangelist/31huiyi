name: 31huiyi API lifecycle
description: >-
  Versioning, deprecation, status and support posture for the 31 OpenAPI, read from the public developer
  center and the main site. 31 maintains its docs actively (pages edited through 2026) but publishes no
  API-level lifecycle policy of any kind.
versioning:
  scheme: per-operation path segment
  global_version: null
  detail: >-
    Version segments appear inside individual paths (/v1/) and a V2 push contract exists as a separate
    documentation page, but there is no single API version, no version header, and no documented rule
    for how a breaking change would be introduced. 41 of the 86 documented operations carry no version
    segment at all.
  examples:
  - /op/api/Bvent/v1/GetBvents
  - /op/api/Attendee/v1/GetAttendeeStatistics
  - /op/api/AttendeePersonal/GetAttendeeDetail (unversioned)
deprecation_policy:
  published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  evidence: >-
    No deprecation policy, sunset schedule, Deprecation/Sunset header, or notice period is published on
    the developer center or the main site. Superseded contracts are simply left in place: the V1
    attendee push (AttendeeRegistrationPush) and the V2 push (AttendeeRegistrationPushV2) are both
    documented as current, with no statement that V1 is going away, and two separate "获取会议列表" event-list
    pages (GetBventList, GetBvents) coexist with no indication which one a new integration should use.
status_page:
  published: false
  evidence: >-
    No status or uptime page is published. status.31huiyi.com does not resolve, and no status link
    appears in the site footer, the developer center or the help centers.
sla:
  published: false
  evidence: No SLA, uptime commitment or support-response target is published on the public site.
