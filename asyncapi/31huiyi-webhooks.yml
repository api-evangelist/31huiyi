name: 31huiyi outbound push (webhook) catalog
description: >-
  31 publishes a documented outbound push surface: the platform POSTs JSON to an endpoint the customer
  hosts on the public internet, on event. The developer center calls these 推送 (push) interfaces and
  states plainly that "此接口由第三方提供" — the customer implements the endpoint and gives 31 the URL. There
  is no self-service subscription API, no published event catalogue endpoint and no AsyncAPI document;
  this file is the catalogue, read from the eight documented push pages.
asyncapi_document_published: false
asyncapi_reason: >-
  No AsyncAPI, CloudEvents or event-schema document is published anywhere on the 31 developer center or
  main site. The event contracts exist only as HTML documentation tables.
transport: HTTPS POST, Content-Type application/json
subscription:
  self_service: false
  mechanism: >-
    The customer supplies a publicly reachable endpoint URL to 31's integration staff; there is no
    documented API to register, list or rotate a webhook endpoint.
security:
  signing: none
  verification: none
  note: >-
    No HMAC signature, shared secret, timestamp or replay protection is documented on any push payload.
    The certificate-status push (证件状态信息推送) is documented explicitly as 不需要鉴权 — no authentication.
    A consumer cannot verify that a delivery came from 31.
delivery:
  acknowledgement_contract: >-
    Two different acknowledgement shapes are documented. The check-in push expects {code, msg} with
    code 0 = success, 4000 = parameter error, 5000 = server error. The exhibitor/exhibit/certificate
    pushes expect {Status, Msg} with Status 1 = success, 2 = failure.
  retry: >-
    The exhibit push documents three retries on failure ("失败的话我们会重试三次"). No retry policy, backoff or
    dead-letter behaviour is documented for the other push types.
  ordering: not documented
  idempotency: >-
    Not documented. The check-in payload carries IsRepeat and IsCanceled flags, which let a consumer
    detect a repeated or cancelled check-in, but there is no delivery-level dedupe key.
events:
- id: checkin.push
  name: 签到推送 — check-in push
  description: >-
    Fired when an attendee checks in through the 31 check-in assistant; delivers a CheckinRecords[]
    batch.
  payload_root: CheckinRecords[]
  key_fields: [BventId, AttendeeId, AttendeeTypeId, CheckinRecordId, CheckinPointId, CheckinPointName,
    CheckinPointType, CheckinTime, CheckinCode, IsRepeat, InputType, Direction, Temperature, DeviceId,
    DeviceName, IsCanceled, IdNumber, FullName, Mobile, Email, Avatar, ValidatedTicket]
  ack: '{code, msg}'
  auth: none documented
  docs: https://api-help.31huiyi.com/zh/checkinpush
  last_updated: '2026-08-03'
- id: attendee.registration.push
  name: 推送参会人数据 — attendee data push
